name: Reportar un error
description: Informa un problema reproducible de NauticMixxx.
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Versión
      placeholder: 1.0.0 + SHA-256 del DMG o ZIP
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Plataforma
      options: [macOS Apple Silicon, Windows x64]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      description: No adjuntes música, bases de datos, rutas privadas ni certificados.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado y resultado actual
    validations:
      required: true
  - type: input
    id: controller
    attributes:
      label: Controlador y firmware
      placeholder: Hercules DJControl Inpulse 500
