name: NauticMixxx Windows x64

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Upload installer to an existing release (main only)
        type: boolean
        default: false
        required: true

permissions:
  contents: write

concurrency:
  group: nauticmixxx-windows-release
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'nauticsoftware/NauticMixxx' && (github.ref == 'refs/heads/main' || !inputs.publish_release)
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free build dependencies
        shell: powershell
        run: |
          python -m pip install Pillow==11.3.0
          choco install nsis --yes --no-progress --limit-output
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
      - name: Validate installer inputs
        shell: powershell
        run: |
          $scripts = @('scripts/build-mixxx-rx3-windows.ps1', 'packaging/windows/configure-profile.ps1')
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw "PowerShell syntax error in $script : $errors" }
          }
          python scripts/test-windows-installer-contract.py
          $profile = Join-Path $env:RUNNER_TEMP 'nautic-profile-check'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File packaging/windows/configure-profile.ps1 -Profile $profile -Template profile/XDJ_RX3_Mixxx.profile.cfg
          if ($LASTEXITCODE -ne 0) { throw 'Windows profile configuration failed' }
          $cfg = Get-Content (Join-Path $profile 'mixxx.cfg') -Raw
          foreach ($setting in @('ResizableSkin XDJ_RX3_Mixxx', 'WaveformType 25', 'UsbOnlyMode 1', 'DJControl_Inpulse_500 1')) {
            if (-not $cfg.Contains($setting)) { throw "Missing preset: $setting" }
          }
          if (-not (Test-Path (Join-Path $profile 'effects.xml'))) { throw 'Sound Color FX configuration missing' }
      - name: Build, test and package native NauticMixxx
        shell: powershell
        run: ./scripts/build-mixxx-rx3-windows.ps1 -WorkRoot C:\rx3-build -Jobs 4
      - name: Smoke test the actual EXE installer
        shell: powershell
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $setup = Join-Path (Resolve-Path build) "NauticMixxx-$version-Windows-x64-Setup.exe"
          if (-not (Test-Path $setup)) { throw "Missing setup: $setup" }
          $setupInfo = (Get-Item $setup).VersionInfo
          if ($setupInfo.ProductName -ne 'NauticMixxx') { throw 'Setup EXE product name is wrong' }
          $install = Start-Process -FilePath $setup -ArgumentList '/S' -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "Silent install failed: $($install.ExitCode)" }
          $installedExe = Join-Path $env:LOCALAPPDATA 'Programs\NauticMixxx\NauticMixxx.exe'
          $profile = Join-Path $env:LOCALAPPDATA 'NauticMixxx'
          if (-not (Test-Path $installedExe)) { throw 'NauticMixxx.exe was not installed' }
          if ((Get-Item $installedExe).VersionInfo.ProductName -ne 'NauticMixxx') { throw 'Installed app identity is wrong' }
          if (Test-Path (Join-Path (Split-Path $installedExe) 'mixxx.exe')) { throw 'Old Mixxx executable remains' }
          $cfg = Get-Content (Join-Path $profile 'mixxx.cfg') -Raw
          foreach ($setting in @('ResizableSkin XDJ_RX3_Mixxx', 'WaveformType 25', 'UsbOnlyMode 1', 'BPMDetectionEnabled 0', 'ReplayGainEnabled 0', 'DJControl_Inpulse_500 1')) {
            if (-not $cfg.Contains($setting)) { throw "Missing preset: $setting" }
          }
          foreach ($path in @('skins\XDJ_RX3_Mixxx\skin.xml', 'controllers\Hercules_DJControl_Inpulse_500_RX3.midi.xml', 'effects\chains\RX3 REVERB.xml', 'effects.xml')) {
            if (-not (Test-Path (Join-Path $profile $path))) { throw "Missing profile file: $path" }
          }
          $effects = [xml](Get-Content (Join-Path $profile 'effects.xml') -Raw)
          $order = @($effects.Effects.QuickEffectPresetList.ChainPresetName)
          if (($order[0..3] -join ',') -ne 'RX3 REVERB,RX3 PING PONG,RX3 NOISE,RX3 FILTER') { throw 'Wrong quick effect order' }
          $uninstall = Start-Process -FilePath (Join-Path (Split-Path $installedExe) 'Uninstall-NauticMixxx.exe') -ArgumentList '/S' -PassThru -Wait
          if ($uninstall.ExitCode -ne 0) { throw "Silent uninstall failed: $($uninstall.ExitCode)" }
          if (Test-Path $installedExe) { throw 'Uninstall left executable behind' }
          if (-not (Test-Path (Join-Path $profile 'mixxx.cfg'))) { throw 'Uninstall removed user profile' }
      - name: Collect build evidence
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force build/ci-results | Out-Null
          $stage = (Get-ChildItem C:/rx3-build -Directory -Filter "stage-*" | Sort-Object LastWriteTime -Descending | Select-Object -First 1).FullName
          if (-not $stage) { throw "Native staging directory was not generated" }
          Copy-Item (Join-Path $stage "rx3-tests.xml") build/ci-results/
          Copy-Item (Join-Path $stage "rx3-build.json") build/ci-results/
      - uses: actions/upload-artifact@v4
        with:
          name: nauticmixxx-windows-${{ github.run_id }}
          path: |
            build/*-Windows-x64-Setup.exe
            build/ci-results/*
          if-no-files-found: error
          compression-level: 0
      - name: Publish the single Windows installer to the public release
        if: inputs.publish_release && github.ref == 'refs/heads/main'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $setup = "build/NauticMixxx-$version-Windows-x64-Setup.exe"
          gh release upload "v$version" $setup --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
